<!doctype html>
<!-- M0 内置冒烟/演示页：验证 REST + WS + 图片内联 + 打断。正式前端在 M1（Vite+React）。 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾光者 · M0 冒烟</title>
<style>
  :root { --bg:#111318; --panel:#1a1d24; --line:#2a2f3a; --fg:#e6e8ee; --dim:#8b93a5; --acc:#4f8cff; }
  * { box-sizing: border-box; margin: 0; }
  body { display: flex; height: 100vh; background: var(--bg); color: var(--fg); font: 14px/1.6 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #side { width: 230px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  #side header { padding: 12px; font-weight: 600; border-bottom: 1px solid var(--line); }
  #list { flex: 1; overflow: auto; }
  #list div.item { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 6px; }
  #list div.item:hover, #list div.item.on { background: #232837; }
  #list .op { color: var(--dim); cursor: pointer; }
  #new { margin: 10px; padding: 8px; border: 0; border-radius: 8px; background: var(--acc); color: #fff; cursor: pointer; }
  #main { flex: 1; display: flex; flex-direction: column; }
  #log { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 78%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--acc); color: #fff; }
  .msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .msg .meta { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .msg img { max-width: 100%; border-radius: 8px; margin: 6px 0; }
  #bar { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); background: var(--panel); }
  #input { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); resize: none; height: 64px; }
  button.act { padding: 0 16px; border: 0; border-radius: 10px; background: var(--acc); color: #fff; cursor: pointer; }
  #stop { background: #c0392b; display: none; }
  #status { padding: 4px 12px; font-size: 12px; color: var(--dim); background: var(--panel); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div id="side">
  <header>会话</header>
  <div id="list"></div>
  <button id="new">＋ 新会话</button>
</div>
<div id="main">
  <div id="log"></div>
  <div id="bar">
    <textarea id="input" placeholder="聊想去哪儿…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button class="act" id="send">发送</button>
    <button class="act" id="stop">■ 停止</button>
  </div>
  <div id="status">未连接</div>
</div>
<script>
const T = new URLSearchParams(location.search).get('token') || '';
const q = p => p + (p.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(T);
const $ = id => document.getElementById(id);
let ws = null, sid = null, cur = null, phase = 0;

async function api(method, path, body) {
  const r = await fetch(q(path), { method, headers: body ? {'content-type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}
function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
// 正文里的本地产物路径 → /media URL（后端 M0-3 提供）
function media(s) {
  return esc(s).replace(/(maps|hotels)\/([A-Za-z0-9_-]+)\/([A-Za-z0-9_\-\.]+\.(?:png|jpg|jpeg|webp))/g,
    (m, a, b, c) => `<img src="${q('/media/'+a+'/'+b+'/'+c)}" alt="${c}">`);
}
function bubble(role) {
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  $('log').appendChild(d); $('log').scrollTop = 1e9;
  return d;
}
function render(el, text) { el.innerHTML = media(text); $('log').scrollTop = 1e9; }

async function refreshList() {
  const metas = await api('GET', '/api/sessions');
  $('list').innerHTML = '';
  for (const m of metas) {
    const d = document.createElement('div');
    d.className = 'item' + (m.id === sid ? ' on' : '');
    const name = document.createElement('span');
    name.textContent = m.name || m.id.slice(0, 12);
    name.onclick = () => openSession(m.id);
    const ops = document.createElement('span');
    ops.className = 'op'; ops.textContent = '删';
    ops.onclick = async e => { e.stopPropagation(); await api('DELETE', '/api/sessions/' + m.id); if (m.id === sid) closeWs(); refreshList(); };
    d.append(name, ops); $('list').appendChild(d);
  }
}
function closeWs() { if (ws) { ws.close(); ws = null; } $('log').innerHTML = ''; $('status').textContent = '未连接'; }

async function openSession(id) {
  closeWs(); sid = id; await refreshList();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/${id}?token=${encodeURIComponent(T)}`);
  ws.onopen = () => $('status').textContent = `已连接 ${id}`;
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === 'history') {
      phase = m.data.phase;
      for (const msg of m.data.messages) {
        if (msg.role === 'user') render(bubble('user'), msg.content);
        else if (msg.content) render(bubble('ai'), msg.content);
      }
      $('status').textContent = `已连接 · 阶段${phase}`;
    } else if (m.type === 'event') {
      onEvent(m.event);
    } else if (m.type === 'error' || m.type === 'lagged') {
      render(bubble('ai'), `⚠ ${m.message || ('丢帧 ' + m.dropped + ' 条，建议刷新')}`);
    }
  };
  ws.onclose = () => $('status').textContent = '连接已断开';
}
function onEvent(e) {
  if (e.Content !== undefined) { cur ??= bubble('ai'); cur._t = (cur._t || '') + e.Content; render(cur, cur._t); }
  else if (e.Reasoning !== undefined) { /* M0 冒烟页不渲染思考过程 */ }
  else if (e.Step !== undefined) { cur = null; }
  else if (e.ToolCall !== undefined) {
    const d = bubble('ai'); d.innerHTML = `<span style="color:var(--dim)">🔧 ${esc(e.ToolCall.name)}</span>`; cur = null;
  } else if (e.ToolResult !== undefined) { cur = null; }
  else if (e.PhaseChange !== undefined) { phase = e.PhaseChange.phase; $('status').textContent = `阶段 → ${phase}`; }
  else if (e.Usage !== undefined) { $('status').textContent = `阶段${phase} · tokens ${e.Usage.total_tokens}`; }
  else if (e.Done !== undefined) { if (e.Done) { cur ??= bubble('ai'); render(cur, e.Done); } cur = null; }
  else if (e.Error !== undefined) { const d = bubble('ai'); render(d, '⚠ ' + e.Error); cur = null; }
}
function send() {
  const text = $('input').value.trim(); if (!text || !ws || ws.readyState !== 1) return;
  render(bubble('user'), text); $('input').value = '';
  ws.send(JSON.stringify({ type: 'chat', text }));
}
$('send').onclick = send;
$('input').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
$('stop').onclick = () => ws && ws.send(JSON.stringify({ type: 'stop' }));
// 进行中隐藏/显示停止键
setInterval(() => $('stop').style.display = ws && ws.readyState === 1 ? 'inline-block' : 'none', 500);
$('new').onclick = async () => {
  const name = prompt('会话名称（可空）：') || '';
  const s = await api('POST', '/api/sessions', name ? { name } : {});
  openSession(s.id);
};
refreshList();
</script>
</body>
</html>
